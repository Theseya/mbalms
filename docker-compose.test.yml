# Isolated test PostgreSQL. Not the live `mbalms` stack.
# Named volume at the image PGDATA path. Do not add tmpfs here.
# Usage: see docs/test-environment.md
name: mbalms-test

services:
  db:
    image: postgres:17
    container_name: mbalms-worksheet-check
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-check}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-check}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in .env.test}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55433}:5432"
    volumes:
      - worksheet-check-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  worksheet-check-data:
    name: mbalms-worksheet-check-data
