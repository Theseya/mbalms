name: mbalms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mbalms}
      POSTGRES_USER: ${POSTGRES_USER:-mbalms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed only on localhost, for development tools and backups.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-mbalms};Username=${POSTGRES_USER:-mbalms};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      # The API is reachable only through the web (nginx) container, so its X-Forwarded-* headers are trusted.
      ForwardedHeaders__Enabled: "true"
      Auth__CookieSecurePolicy: ${AUTH_COOKIE_SECURE_POLICY:-SameAsRequest}
      App__TimeZone: ${APP_TIMEZONE:-Europe/Moscow}
      Seed__ProgramName: ${PROGRAM_NAME:-MBA}
      Seed__ManagerEmail: ${MANAGER_EMAIL:-}
      Seed__ManagerPassword: ${MANAGER_PASSWORD:-}
    volumes:
      - api-keys:/keys

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  api-keys:
